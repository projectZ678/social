<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>socialanxiety.lol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Pirata+One&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#000;--fg:#ededed;--muted:#7a7672;--dim:#4d4a47}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif}
body{overflow:hidden;background:#000}
#ascii{position:fixed;inset:-3%;z-index:0;overflow:hidden;pointer-events:none;user-select:none;white-space:pre;font:clamp(7px,.62vw,11px)/1.18 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.02em;color:#6b6b6b;opacity:.16}
#shade{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 30%,#000 100%)}
.shell{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;padding:clamp(18px,3vw,42px);max-width:1900px;margin:auto}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;font:13px/1.2 ui-monospace,SFMono-Regular,monospace;color:#777}
.brand{font-family:Georgia,"Times New Roman",serif;font-size:clamp(20px,2.1vw,29px);font-weight:700;letter-spacing:-.04em;color:#ececec;text-decoration:none;justify-self:start}
.pick{justify-self:center;letter-spacing:.06em;color:#666}
.top-right{justify-self:end;display:flex;align-items:center;gap:26px}
.track{display:flex;align-items:center;gap:12px;color:#d6d2cd;letter-spacing:.03em}
.eq{display:flex;align-items:flex-end;gap:2px;height:14px}
.eq i{display:block;width:3px;height:100%;background:#ddd;border-radius:1px;transform-origin:bottom;transform:scaleY(.5)}
.on .eq i{animation:eq 1s ease-in-out infinite}
.on .eq i:nth-child(2){animation-delay:-.3s}
.on .eq i:nth-child(3){animation-delay:-.6s}
.on .eq i:nth-child(4){animation-delay:-.15s}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.sound{border:0;background:none;color:#7a7672;font:inherit;cursor:pointer;padding:0;transition:color .2s}
.sound:hover{color:#fff}
main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.view{width:min(100%,900px);display:flex;flex-direction:column;align-items:center;text-align:center;animation:enter .5s ease both}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.avatar{display:block;width:clamp(70px,8vw,110px);height:clamp(70px,8vw,110px);border-radius:50%;object-fit:cover;background:#141414;border:1px solid rgba(255,255,255,.35);transition:transform .35s}
.go{text-decoration:none;color:inherit;display:flex;flex-direction:column;align-items:center;outline-offset:8px}
.go:hover .avatar{transform:scale(1.04)}
.heading{font-family:"Pirata One",Georgia,serif;font-size:clamp(80px,15vw,190px);line-height:.95;letter-spacing:-.01em;font-weight:400;margin:clamp(14px,3vh,34px) 0 clamp(10px,2.5vh,28px);color:#f2f2f2;text-transform:lowercase;max-width:100%;overflow-wrap:anywhere;transition:color .25s}

.info{display:flex;align-items:center;justify-content:center;gap:14px;font:13px/1.2 ui-monospace,SFMono-Regular,monospace;color:#777;letter-spacing:.05em;margin:0 0 clamp(18px,4vh,42px);max-width:100%}
.info b{font-weight:600;color:#ddd}
.info .dot{color:#444}
.info .desc{max-width:26ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail{display:flex;align-items:center;justify-content:center;gap:clamp(8px,1.4vw,16px);flex-wrap:wrap;width:min(100%,820px)}
.thumb-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;padding-bottom:12px}
.thumb-wrap::after{content:"";position:absolute;bottom:0;width:4px;height:4px;border-radius:50%;background:#fff;opacity:0;transition:opacity .2s}
.thumb-wrap.active::after{opacity:1}
.thumb{--glow:rgba(180,180,255,.75);width:clamp(40px,4.6vw,66px);height:clamp(40px,4.6vw,66px);border-radius:50%;border:2px solid transparent;background:#111;padding:0;cursor:pointer;overflow:hidden;opacity:.5;filter:grayscale(1);transition:transform .2s,opacity .2s,filter .2s,border-color .2s}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb:hover{opacity:1;filter:grayscale(0);border-color:#555}
.thumb.active{opacity:1;filter:grayscale(0);border-color:#fff}
.thumb:focus-visible{outline:2px solid #fff;outline-offset:3px}
.footer{display:flex;justify-content:center;align-items:center;gap:26px;color:#4a4a4a;font:13px/1.2 ui-monospace,SFMono-Regular,monospace;letter-spacing:.04em;padding-top:6px}
.footer b{font-weight:500;color:#bbb;margin-right:6px}
#notice{position:fixed;left:50%;bottom:56px;transform:translateX(-50%);font:12px ui-monospace,monospace;color:#8a8680;text-align:center;max-width:90%;z-index:5}
@media(max-width:700px){.top{grid-template-columns:1fr auto}.pick{display:none}.top-right{gap:14px}.track span{display:none}.info{gap:9px;font-size:11px}.footer{font-size:11px;gap:14px}.thumb{width:44px;height:44px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="ascii" aria-hidden="true"></div><div id="shade"></div>
<div class="shell" id="shell">
  <header class="top">
    <a class="brand" href="./">social</a>
    <span class="pick">select character</span>
    <div class="top-right">
      <span class="track"><span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span id="trackName">addicted — osamason</span></span>
      <button class="sound" id="sound" type="button" aria-pressed="false">sound off</button>
    </div>
  </header>
  <main>
    <section class="view" id="view" aria-live="polite">
      <a class="go" id="go" href="./">
        <img class="avatar" id="avatar" alt="" src="https://raw.githubusercontent.com/projectZ678/social/main/79c341f9-ba05-4776-bf23-3e9f1a773768.png">
        <h1 class="heading" id="title">social</h1>
      </a>
      <p class="info" id="info"><b id="handle">@socialanxiety.lol</b><span class="dot">·</span><span class="desc" id="description">loading</span><span class="dot">·</span><span id="count">— / —</span></p>
      <nav class="rail" id="rail" aria-label="Choose a page"></nav>
    </section>
  </main>
  <footer class="footer">
    <span><b>← →</b>choose</span>
    <span><b>enter</b>select</span>
    <span><b>m</b>mute</span>
  </footer>
</div>
<div id="notice" role="status"></div>
<script>
(() => {
  "use strict";
  const OWNER = "projectZ678";
  const REPO = "social";
  const BRANCH = "main";
  const SITE_BASE = "https://socialanxiety.lol/";
  const RAW_BASE = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/`;
  const DEFAULT_AVATAR = RAW_BASE + "79c341f9-ba05-4776-bf23-3e9f1a773768.png";
  // Optional: set a direct link to an mp3 to play real music when sound is on.
  const MUSIC_URL = "";
  const $ = id => document.getElementById(id);
  let pages = [];
  let selected = 0;
  let soundOn = false;
  let audioContext = null;
  let music = null;

  // Background glyph field: a soft cluster of characters, generated locally.
  const ramp = " .,:;-~=+*xoe#%";
  let seed = 93217;
  const rand = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const COLS = 260, ROWS = 110;
  const blobs = [[.5,.40,.20,.30],[.37,.55,.15,.22],[.63,.55,.15,.22],[.5,.72,.30,.14],[.26,.38,.12,.2],[.74,.38,.12,.2]];
  let art = "";
  for (let y = 0; y < ROWS; y++) {
    let line = "";
    for (let x = 0; x < COLS; x++) {
      const nx = x / COLS, ny = y / ROWS;
      let d = 0;
      for (const [cx, cy, rx, ry] of blobs) {
        const v = 1 - Math.hypot((nx - cx) / rx, (ny - cy) / ry);
        if (v > d) d = v;
      }
      const base = .08 + Math.max(0, d) * .95;
      const level = Math.min(ramp.length - 1, Math.floor(base * ramp.length * (.55 + rand() * .6)));
      line += ramp[level];
    }
    art += line + "\n";
  }
  $("ascii").textContent = art;

  const safeName = file => file.replace(/\.html?$/i, "").replace(/[-_]+/g, " ").replace(/\b\w/g, c => c.toUpperCase());
  const slug = file => file.replace(/\.html?$/i, "");
  // Clean URL: no .html at the end (e.g. https://socialanxiety.lol/hours)
  const pageUrl = file => new URL(slug(file), SITE_BASE).href;

  function absoluteAsset(src, file) {
    if (!src) return DEFAULT_AVATAR;
    try { return new URL(src, RAW_BASE + file).href; } catch { return DEFAULT_AVATAR; }
  }
  async function getPageInfo(file) {
    const fallback = { file, title: safeName(file), description: "", image: DEFAULT_AVATAR };
    try {
      const response = await fetch(RAW_BASE + encodeURIComponent(file), { cache: "no-cache" });
      if (!response.ok) return fallback;
      const doc = new DOMParser().parseFromString(await response.text(), "text/html");
      const title = doc.querySelector('meta[property="og:title"]')?.content ||
                    doc.querySelector('meta[name="twitter:title"]')?.content ||
                    doc.querySelector("title")?.textContent?.trim() || fallback.title;
      const image = doc.querySelector('meta[property="og:image"]')?.content ||
                    doc.querySelector('meta[name="twitter:image"]')?.content ||
                    doc.querySelector("img")?.getAttribute("src") || DEFAULT_AVATAR;
      const desc = doc.querySelector('meta[property="og:description"]')?.content ||
                   doc.querySelector('meta[name="description"]')?.content || "";
      const cleanTitle = title.replace(/\s*[|—-]\s*socialanxiety\.lol\s*$/i, "").trim();
      return { file, title: cleanTitle || safeName(file), description: desc, image: absoluteAsset(image, file) };
    } catch { return fallback; }
  }

  function render() {
    if (!pages.length) return;
    const p = pages[selected];
    $("title").textContent = p.title;
    $("avatar").src = p.image || DEFAULT_AVATAR;
    $("avatar").alt = p.title;
    $("handle").textContent = "@" + slug(p.file);
    $("description").textContent = p.description || "page";
    $("count").textContent = String(selected + 1).padStart(2, "0") + " / " + String(pages.length).padStart(2, "0");
    $("go").href = pageUrl(p.file);
    $("go").setAttribute("aria-label", "Open " + p.title);
    $("rail").querySelectorAll(".thumb-wrap").forEach((w, i) => {
      w.classList.toggle("active", i === selected);
      w.firstElementChild.classList.toggle("active", i === selected);
      w.firstElementChild.setAttribute("aria-current", i === selected ? "true" : "false");
    });
    $("view").animate([{opacity:.7,transform:"translateY(4px)"},{opacity:1,transform:"none"}],{duration:220,easing:"ease-out"});
  }
  function move(step) {
    if (!pages.length) return;
    selected = (selected + step + pages.length) % pages.length;
    render();
    blip(step > 0 ? 560 : 480);
  }
  function openSelected() {
    if (pages.length) window.location.href = pageUrl(pages[selected].file);
  }
  const glowColors = ["#ff6b6b","#ffad5c","#ffe66d","#8eea75","#45e6c1","#55c7ff","#718cff","#a78bfa","#e879f9","#ff78b7","#f472b6","#b8c0ff"];
  function buildRail() {
    const rail = $("rail");
    rail.innerHTML = "";
    pages.forEach((p, i) => {
      const wrap = document.createElement("div");
      wrap.className = "thumb-wrap" + (i === selected ? " active" : "");
      const button = document.createElement("button");
      button.className = "thumb" + (i === selected ? " active" : "");
      button.style.setProperty("--glow", glowColors[i % glowColors.length]);
      button.type = "button";
      button.title = p.title;
      button.setAttribute("aria-label", "Select " + p.title);
      const img = document.createElement("img");
      img.src = p.image || DEFAULT_AVATAR;
      img.alt = "";
      img.loading = "lazy";
      button.append(img);
      // Click selects; clicking the already-selected one opens it.
      button.addEventListener("click", () => {
        if (i === selected) openSelected();
        else { selected = i; render(); blip(520); }
      });
      wrap.append(button);
      rail.append(wrap);
    });
  }
  const CACHE_KEY = "social:files:v1";
  const readCache = () => { try { return JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); } catch { return null; } };
  const writeCache = files => { try { localStorage.setItem(CACHE_KEY, JSON.stringify({t: Date.now(), files})); } catch {} };
  const onlyPages = names => names
    .filter(n => /\.html?$/i.test(n) && n.toLowerCase() !== "index.html")
    .sort((a, b) => a.localeCompare(b, undefined, {numeric:true}));

  // Lists the repo's html files. Tries the GitHub API first, then jsDelivr (no rate limit),
  // then the last list we saved in this browser.
  async function listFiles() {
    const cached = readCache();
    if (cached && Date.now() - cached.t < 120000 && cached.files?.length) return cached.files;
    const sources = [
      async () => {
        const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents?ref=${BRANCH}`, {headers: {"Accept": "application/vnd.github+json"}});
        if (!r.ok) throw new Error("GitHub API " + r.status);
        return onlyPages((await r.json()).filter(i => i.type === "file").map(i => i.name));
      },
      async () => {
        const r = await fetch(`https://data.jsdelivr.com/v1/packages/gh/${OWNER}/${REPO}@${BRANCH}?structure=flat`);
        if (!r.ok) throw new Error("jsDelivr " + r.status);
        const data = await r.json();
        return onlyPages((data.files || []).map(f => f.name).filter(n => n.split("/").length === 2).map(n => n.slice(1)));
      }
    ];
    for (const get of sources) {
      try {
        const files = await get();
        if (files.length) { writeCache(files); return files; }
      } catch (e) { console.warn(e); }
    }
    if (cached?.files?.length) return cached.files;
    throw new Error("Could not list pages");
  }

  async function loadPages() {
    try {
      const htmlFiles = await listFiles();
      pages = await Promise.all(htmlFiles.map(getPageInfo));
      buildRail();
      selected = 0;
      render();
      $("notice").textContent = "";
    } catch (error) {
      pages = [{file:"hours.html", title:"Hours", description:"", image:DEFAULT_AVATAR}];
      buildRail();
      render();
      $("notice").textContent = "Couldn't read the repository file list. Showing the fallback page.";
      console.warn(error);
    }
  }

  function blip(freq) {
    if (!soundOn || MUSIC_URL || !audioContext) return;
    try {
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.type = "sine"; osc.frequency.value = freq;
      gain.gain.setValueAtTime(.0001, audioContext.currentTime);
      gain.gain.exponentialRampToValueAtTime(.025, audioContext.currentTime + .02);
      gain.gain.exponentialRampToValueAtTime(.0001, audioContext.currentTime + .15);
      osc.connect(gain); gain.connect(audioContext.destination);
      osc.start(); osc.stop(audioContext.currentTime + .16);
    } catch {}
  }
  async function setSound(on) {
    soundOn = on;
    $("sound").textContent = on ? "sound on" : "sound off";
    $("sound").setAttribute("aria-pressed", String(on));
    $("shell").classList.toggle("on", on);
    try {
      if (MUSIC_URL) {
        music ||= Object.assign(new Audio(MUSIC_URL), { loop: true, volume: .5 });
        on ? await music.play() : music.pause();
      } else if (on) {
        audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
        await audioContext.resume();
        blip(520);
      }
    } catch { soundOn = false; $("sound").textContent = "sound off"; $("shell").classList.remove("on"); }
  }

  $("sound").addEventListener("click", () => setSound(!soundOn));
  window.addEventListener("keydown", e => {
    if (e.target.matches("input,textarea,select") || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "ArrowLeft") move(-1);
    else if (e.key === "ArrowRight") move(1);
    else if (e.key === "Enter" && !e.target.closest("a,button")) openSelected();
    else if (e.key.toLowerCase() === "m") setSound(!soundOn);
  });
  // Swipe left/right on touch screens
  let touchX = null;
  window.addEventListener("touchstart", e => { touchX = e.touches[0].clientX; }, {passive:true});
  window.addEventListener("touchend", e => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    touchX = null;
    if (Math.abs(dx) > 50) move(dx < 0 ? 1 : -1);
  }, {passive:true});

  loadPages();
})();
</script>
</body>
</html>
