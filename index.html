<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>socialanxiety.lol — accounts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Pirata+One&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#ededed;font-family:Inter,system-ui,sans-serif}
body{overflow:hidden}

/* ---------- background ascii ---------- */
#ascii{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;user-select:none;display:flex;align-items:center;justify-content:center}
#ascii pre{margin:0;white-space:pre;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;line-height:1;color:#909090;opacity:.2;filter:blur(1.1px);transition:opacity .6s ease,filter .6s ease;will-change:font-size}
body:hover #ascii pre{opacity:.32;filter:blur(.6px)}

/* ---------- shell (fully transparent) ---------- */
.shell{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;padding:clamp(18px,3vw,42px);max-width:1900px;margin:auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:20px;font-size:13px;color:#8c8c8c}
.brand{font-family:Georgia,serif;font-size:clamp(18px,2vw,27px);font-weight:700;letter-spacing:-.04em;color:#e7e7e7;text-decoration:none;background:none}
.top-right{display:flex;align-items:center;gap:22px;font:12px/1.2 ui-monospace,monospace}
.sound{border:0;background:none;color:#777;font:inherit;cursor:pointer;transition:color .2s}
.sound:hover{color:#fff}

main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.view{width:min(100%,760px);display:flex;flex-direction:column;align-items:center;text-align:center;animation:enter .45s ease both;transform-origin:center}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.avatar{width:clamp(58px,6vw,82px);height:clamp(58px,6vw,82px);border-radius:50%;object-fit:cover;background:transparent;border:1px solid rgba(255,255,255,.12);box-shadow:0 10px 40px #0006;transition:transform .35s,filter .35s,border-color .35s;backdrop-filter:blur(2px)}
.avatar:hover{transform:translateY(-4px) scale(1.04);filter:brightness(1.08);border-color:rgba(255,255,255,.35)}

.heading{font-family:"Pirata One",Georgia,serif;font-size:clamp(70px,13vw,150px);line-height:.9;letter-spacing:-.02em;font-weight:400;margin:26px 0 14px;color:#eee;text-shadow:0 8px 35px #fff1;max-width:100%;overflow-wrap:anywhere;background:none}
.handle{font:12px ui-monospace,SFMono-Regular,monospace;color:#8a8a8a;letter-spacing:.04em;margin:0 0 16px}
.meta{font:11px ui-monospace,monospace;color:#666;letter-spacing:.1em;text-transform:uppercase;margin:0 0 18px;max-width:60ch}

/* ---------- badges ---------- */
.badges{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;margin:0 0 22px;padding:0;background:none;max-width:min(100%,560px)}
.badges:empty{display:none}
.badge{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border:1px solid rgba(255,255,255,.13);border-radius:999px;background:transparent;color:#b6b6b6;font:10px/1.2 ui-monospace,SFMono-Regular,monospace;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;transition:border-color .2s,color .2s,transform .2s;backdrop-filter:blur(2px)}
.badge:hover{border-color:rgba(255,255,255,.4);color:#fff;transform:translateY(-1px)}
.badge img{width:14px;height:14px;object-fit:contain;display:block;filter:grayscale(1) brightness(1.25)}
.badge:hover img{filter:grayscale(0) brightness(1.1)}

.actions{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 0 22px}
.arrow{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:transparent;color:#aaa;font-size:20px;display:grid;place-items:center;cursor:pointer;transition:transform .2s,border-color .2s,color .2s;backdrop-filter:blur(2px)}
.arrow:hover{transform:scale(1.08);border-color:rgba(255,255,255,.32);color:#fff}
.arrow:active{transform:scale(.96)}
.count{font:12px ui-monospace,monospace;color:#666;min-width:74px}

.rail-wrap{width:min(100%,680px);margin-top:2px}
.rail{display:flex;align-items:center;justify-content:center;gap:clamp(10px,1.6vw,18px);flex-wrap:wrap}
.thumb{width:clamp(40px,4vw,56px);height:clamp(40px,4vw,56px);border-radius:50%;border:1px solid rgba(255,255,255,.1);background:transparent;padding:0;cursor:pointer;overflow:hidden;opacity:.5;filter:grayscale(1);transition:transform .22s,opacity .22s,filter .22s,border-color .22s,box-shadow .22s}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb:hover{opacity:1;transform:translateY(-3px) scale(1.08);filter:grayscale(0);border-color:rgba(255,255,255,.6);box-shadow:0 0 12px rgba(255,255,255,.25)}
.thumb.active{opacity:1;filter:grayscale(0);border-color:#fff;transform:scale(1.07);box-shadow:0 0 0 3px rgba(255,255,255,.08)}

.footer{display:flex;justify-content:space-between;align-items:center;gap:15px;color:#555;font:10px ui-monospace,monospace;background:none}
.status{display:flex;align-items:center;gap:8px}
.pulse{width:5px;height:5px;border-radius:50%;background:#777;box-shadow:0 0 9px #7777}
#notice{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);font:12px ui-monospace,monospace;color:#888;text-align:center;max-width:90%;z-index:5}
@media(max-width:600px){.shell{padding:18px}.top-right{gap:10px}.heading{margin:20px 0 12px}.footer{font-size:9px}.rail{gap:8px}.thumb{width:38px;height:38px}.badge{font-size:9px;padding:4px 8px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="ascii" aria-hidden="true"><pre id="asciiArt"></pre></div>

<div class="shell">
  <header class="top">
    <a class="brand" href="./">social</a>
    <div class="top-right">
      <span id="repoState">loading pages</span>
      <button class="sound" id="sound" type="button" aria-pressed="false">sound off</button>
    </div>
  </header>
  <main>
    <section class="view" id="view" aria-live="polite">
      <img class="avatar" id="avatar" alt="" src="https://raw.githubusercontent.com/projectZ678/social/main/79c341f9-ba05-4776-bf23-3e9f1a773768.png">
      <h1 class="heading" id="title">social</h1>
      <p class="handle" id="handle">socialanxiety.lol</p>
      <div class="meta" id="description">account / page</div>
      <div class="badges" id="badges" aria-label="Badges"></div>
      <div class="actions">
        <button class="arrow" id="prev" type="button" aria-label="Previous account">‹</button>
        <span class="count" id="count">— / —</span>
        <button class="arrow" id="next" type="button" aria-label="Next account">›</button>
      </div>
      <div class="rail-wrap"><nav class="rail" id="rail" aria-label="Choose a page"></nav></div>
    </section>
  </main>
  <footer class="footer">
    <span>socialanxiety.lol</span>
    <span class="status"><i class="pulse"></i><span id="statusText">connecting to main</span></span>
  </footer>
</div>
<div id="notice" role="status"></div>

<script>
(() => {
  "use strict";
  const OWNER = "projectZ678";
  const REPO = "social";
  const BRANCH = "main";
  const SITE = "socialanxiety.lol";
  const RAW_BASE = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/`;
  const CDN_BASE = `https://cdn.jsdelivr.net/gh/${OWNER}/${REPO}@${BRANCH}/`;
  const DEFAULT_AVATAR = RAW_BASE + "79c341f9-ba05-4776-bf23-3e9f1a773768.png";
  const $ = id => document.getElementById(id);

  let pages = [];
  let selected = 0;
  let soundOn = false;
  let audioContext = null;

  /* ================= background ascii art ================= */
  const ART = `#***#*****####**#****++===+*=----=#=...................=*+++++*##*#*#%##******************************************###****#%*+++++*+:..................-+===------:::::=++=-==--=========++=+**++
#**********#%#******=++++++++-----+....................+*++++*#####*#%#****#******************************************####*****##*++++**-...................====------:::::=++=-=======+=====++=+**++
*************##****+--++++++*=---=-....................**+++*###**#*#%##*###******************************************###*******##*+++**-...................-+==------:::::=++=========++++++++++++++
++++++++++++++***+++---=++++*+=--+....................:++*+*#####*###%##########***#*****************************###*******##*+++*#-...................:+===-----::::-=+++====++++++++++++++++++
###################*=----=+++*+-==....................===**#########%########*##***##****************************####******###*+**+-....................===-------:::-=+*++******###############
%%%%%%%%%%%%%%%%%%%#=------=+*#++:....................+--=########################******###******************#***##############*+===....................-===------:::-=+***#######%%%%%%%%%%%%%%
%%%%%%%%%%%%%%%%%%%#=----------+*:...................:+--+#########%##################******************#****#***##############*=-==....................:===-------::-=+***######%%%%%%%%%%%%%%%
%%%%%%%%%%%%%%%%%%%#=----------==....................==-=########################################*########*********######+==+*##+-==-....................+===------::-=*****######%%%%%%%%%%%%%%
##%######%%%%%%%%%%#=----------=-....................*-=##*#######%#########################################*****#####%#+=====+##=-+=....................====---------=**********#######%%%%%%%%
**##*##**#%%%%%%%%%#=----------+:...................-+=%#+++########################***###############################*+========+*==+:...................====---------=**++++++*****##**#%%%%%%#
##########%%%%%%%%%#=---------=+:...................+=%#+++++#########################################################+=========+++=+-...................====-------:-=*++++++++****#***########
######*####%%%%%%%%#=---------==:..................:*#*++++++*#######################################################++=========+=++==:..................=+==-------:-=**+++++++****##*########*
#*##*****###%%#%%###=---------=-...................=#*++++++++*#%###################################################*+==+====++==++++*-..................-+==---------=**+++++******##**#######*
**#******###%######*=---------+-..................:#*++++++++++####################################################*+==+=++==++++++++*+:.................-+===--------=**+++++++****#***#######*
*###****############=--------=+:..................-*+++++++++++*##################################################*++++++++++++++++++*#=.................:+===--------=**++++++*****#***########
####****############=--------==:.................:*+++++++++++++*#################################################++++=+++=+++++++++++**:................:+====-------=**+++********#***########
####****####%######*=-------===:.................++++++++++++++++################################################*+++++++++++++++++++++*+................:+====-------=**+++********##**########
#####**#####%#######=====----+-.................-+++++++++++++++++##############################################*+++++++++++++++++++++++*-...............:+====-------=**++++*******##**########
*###****####%#######=====---=+-................:++++++++++++++++++*#############################################++++++++++++++++++==++++++++++-...............+====-------=**+++*****#*###**########
####****############=======-=+-................++++++++++++++++++++############################################*++++++++++=+=====+++++++++*-..............+====-------=***+******#####**########
####****########%%##=========+:...............-+++++++++++++++++++++###########################################++++++++++===========+++++++*:.............++===-------=**********#####*######%##
####****####%####%##========+=:..............:=++++++++=====++++++++*#########################################++++++++++============++++++++*.............++===-------=+********################
#####****###%####%##========+=:..............=+++++++=======+++++++++*#######################################*++++++++++==============++++++++............=+====------=+********################
#####***#########%##========+-..............-+++++++==========++++++++#######################################++++++++++===============+++++++*=...........=+====------=+********################
*###****#########%##========+-.............:=+++++++==========+++++++++%####################################++++++++++================++++++++*-..........-+=====-----=+*********#####**########
*********###########========+-.............-++++++++==========+++++++++*%#################################%*+++++++++=================++++++++++..........:*+===------=**++++++*******+*****##**
*********##########*=========:............:=++++++++==========++++++++++*##################################+++++++++++=================++++++++*=:...:::-====+*==-----=**+++++++******+*********
*********##########*=========:...........:-*++++++++===========++++++++++################################%++++++++++++================++++++++++*=-:::::.....:*===----+*************************
*******************+====++++=:...........:++++++++++===========++++++++++*##############################%*++++++++++++================+++++++++++:............*===---=+**++++++++++++*+*+*******
*******************+===++:-======--::::::=*+++++++++===========+++++++++++*#############################%+++++++++++++================+++++++++++=............+====--=+**++++++++***************`;

  const ART_LINES = ART.split("\n");
  const ART_ROWS = ART_LINES.length;
  const ART_COLS = ART_LINES.reduce((m, l) => Math.max(m, l.length), 0);
  const CHAR_RATIO = 0.6; /* monospace width / height */

  $("asciiArt").textContent = ART;

  function fitArt() {
    const fs = Math.max(
      window.innerWidth / (ART_COLS * CHAR_RATIO),
      window.innerHeight / ART_ROWS
    );
    $("asciiArt").style.fontSize = fs.toFixed(2) + "px";
  }
  fitArt();
  window.addEventListener("resize", fitArt);
  window.addEventListener("orientationchange", fitArt);

  /* ================= helpers ================= */
  const safeName = file =>
    file.replace(/\.html?$/i, "").replace(/[-_]+/g, " ")
        .replace(/\b\w/g, c => c.toUpperCase());
  const cleanName = file => file.replace(/\.html?$/i, "");
  const encodePath = file => file.split("/").map(encodeURIComponent).join("/");

  function stripSite(t) {
    const site = SITE.replace(/\./g, "\\.");
    return (t || "")
      .replace(new RegExp(`^\\s*${site}\\s*[—–|:-]\\s*`, "i"), "")
      .replace(new RegExp(`\\s*[—–|:-]\\s*${site}\\s*$`, "i"), "")
      .trim();
  }

  function isPlaceholder(v) {
    const n = (v || "").toLowerCase().replace(/\s+/g, " ").trim();
    return !n ||
      n === "social" ||
      n === SITE ||
      n === "accounts" ||
      n === "account" ||
      n === "page" ||
      n === "account / page" ||
      n === "profile" ||
      n === "loading pages" ||
      n.startsWith(SITE + " —") ||
      n.startsWith(SITE + " -");
  }

  function absoluteAsset(src, file) {
    if (!src) return DEFAULT_AVATAR;
    try {
      return new URL(src, RAW_BASE + encodePath(file)).href;
    } catch { return DEFAULT_AVATAR; }
  }

  /* ================= fetch raw + jsDelivr fallback ================= */
  async function fetchSource(file) {
    const path = encodePath(file);
    for (const url of [RAW_BASE + path, CDN_BASE + path]) {
      try {
        const res = await fetch(url, { cache: "no-cache" });
        if (res.ok) {
          const text = await res.text();
          if (text && text.trim()) return text;
        }
      } catch {}
    }
    return null;
  }

  async function mapLimit(items, limit, fn) {
    const out = new Array(items.length);
    let i = 0;
    const workers = Array.from({ length: Math.min(limit, items.length) }, async () => {
      while (i < items.length) {
        const idx = i++;
        out[idx] = await fn(items[idx]);
      }
    });
    await Promise.all(workers);
    return out;
  }

  /* ================= profile extraction ================= */
  function pickValue(doc, selectors, isValid) {
    for (const sel of selectors) {
      let el = null;
      try { el = doc.querySelector(sel); } catch { continue; }
      if (!el) continue;
      const raw = (el.getAttribute("content") || el.textContent || "")
        .replace(/\s+/g, " ").trim();
      if (raw && (!isValid || isValid(raw))) return raw;
    }
    return "";
  }

  /* ---------- badges from raw html ---------- */
  function extractBadges(doc, jsonBlobs, file) {
    const out = [];
    const seen = new Set();

    const add = (label, img) => {
      label = (label || "").replace(/\s+/g, " ").trim().slice(0, 40);
      img = (img || "").trim();
      if (!label && !img) return;
      const key = (img || "") + "::" + label.toLowerCase();
      if (seen.has(key)) return;
      seen.add(key);
      out.push({ label, img: img ? absoluteAsset(img, file) : "" });
    };

    const fromEl = el => {
      if (!el || el.nodeType !== 1) return;
      if (el.tagName === "IMG") {
        add(el.getAttribute("alt") || el.getAttribute("title") || "", el.getAttribute("src") || "");
        return;
      }
      const attr = el.getAttribute && el.getAttribute("data-badge");
      if (attr) add(attr, "");
      const img = el.querySelector ? el.querySelector("img") : null;
      const text = (el.textContent || "").replace(/\s+/g, " ").trim();
      if (img) add(text || img.getAttribute("alt") || "", img.getAttribute("src") || "");
      else if (text && text.length <= 40) add(text, "");
    };

    /* 1. data-badges="a,b,c" */
    doc.querySelectorAll("[data-badges]").forEach(el => {
      const raw = el.getAttribute("data-badges") || "";
      raw.split(/[,|;]/).forEach(part => add(part, ""));
    });

    /* 2. badge containers */
    const containers = [...doc.querySelectorAll(
      "#badges, .badges, .badge-list, .badges-list, .badge-row, .badges-wrap, .user-badges, .profile-badges"
    )].filter(el => el !== doc.body && el !== doc.documentElement);

    containers.forEach(c => {
      const kids = [...c.children];
      if (kids.length) kids.forEach(fromEl);
      else fromEl(c);
    });

    /* 3. individual badge elements */
    doc.querySelectorAll("[data-badge], .badge, .user-badge, .profile-badge").forEach(fromEl);

    /* 4. structured data */
    jsonBlobs.forEach(obj => {
      if (!obj || typeof obj !== "object") return;
      const b = obj.badges || obj.badge;
      if (!Array.isArray(b)) return;
      b.forEach(x => {
        if (typeof x === "string") add(x, "");
        else if (x && typeof x === "object") {
          add(x.name || x.label || x.title || x.text || "", x.image || x.icon || x.src || x.url || "");
        }
      });
    });

    return out.slice(0, 14);
  }

  function extractProfile(source, file) {
    const doc = new DOMParser().parseFromString(source, "text/html");

    const bodyAttr = name =>
      (doc.body?.getAttribute("data-" + name) ||
       doc.documentElement.getAttribute("data-" + name) || "").trim();

    const jsonBlobs = [];
    doc.querySelectorAll('script[type="application/ld+json"], script[type="application/json"]').forEach(s => {
      try { jsonBlobs.push(JSON.parse(s.textContent)); } catch {}
    });
    const fromJson = keys => {
      for (const obj of jsonBlobs) {
        if (!obj || typeof obj !== "object") continue;
        for (const k of keys) {
          const v = obj[k];
          if (typeof v === "string" && v.trim()) return v.trim();
        }
      }
      return "";
    };

    const scriptText = [...doc.querySelectorAll("script:not([src])")]
      .map(s => s.textContent || "").join("\n");
    const grab = keys => {
      for (const k of keys) {
        const re = new RegExp('["\'`]?' + k + '["\'`]?\\s*[:=]\\s*["\'`]([^"\'`]{1,200})["\'`]', "i");
        const m = scriptText.match(re);
        if (m) return m[1].trim();
      }
      return "";
    };

    /* ---- title ---- */
    let title =
      pickValue(doc, [
        'meta[property="og:title"]',
        'meta[name="twitter:title"]',
        'meta[name="title"]'
      ], v => !isPlaceholder(v)) ||
      pickValue(doc, [
        "#title", ".heading", "h1", "[data-title]",
        ".name", "#name", "[data-name]"
      ], v => !isPlaceholder(v)) ||
      bodyAttr("title") || bodyAttr("name") ||
      fromJson(["name", "headline", "title"]) ||
      grab(["displayName", "display_name", "name", "title"]) ||
      stripSite(doc.querySelector("title")?.textContent || "");
    title = stripSite(title);
    if (isPlaceholder(title)) title = safeName(file);

    /* ---- handle ---- */
    let handle =
      pickValue(doc, [
        'meta[name="profile:username"]',
        'meta[property="profile:username"]',
        'meta[name="username"]'
      ], Boolean) ||
      pickValue(doc, [
        "#handle", ".handle", "[data-handle]",
        ".username", "#username"
      ], v => !isPlaceholder(v)) ||
      bodyAttr("handle") || bodyAttr("username") ||
      fromJson(["username", "handle", "user"]) ||
      grab(["handle", "username", "user"]);
    if (!handle) {
      const m = (doc.body?.textContent || "").match(/(?:^|\s)(@[A-Za-z0-9_.]{2,32})/);
      if (m && !/socialanxiety/i.test(m[1])) handle = m[1];
    }
    if (!handle || isPlaceholder(handle)) handle = SITE;

    /* ---- description ---- */
    let description =
      pickValue(doc, [
        'meta[property="og:description"]',
        'meta[name="description"]',
        'meta[name="twitter:description"]'
      ], v => !isPlaceholder(v)) ||
      pickValue(doc, [
        "#description", ".meta", "[data-description]",
        ".bio", "#bio"
      ], v => !isPlaceholder(v)) ||
      bodyAttr("description") || bodyAttr("bio") ||
      fromJson(["description", "bio"]) ||
      grab(["description", "bio", "desc"]);
    if (isPlaceholder(description)) description = "profile";

    /* ---- avatar image ---- */
    let image =
      pickValue(doc, [
        'meta[property="og:image"]',
        'meta[name="twitter:image"]',
        'meta[name="og:image"]'
      ], Boolean) ||
      bodyAttr("avatar") || bodyAttr("image") ||
      fromJson(["image", "avatar", "profileImage"]) ||
      grab(["avatar", "image", "pfp"]);

    if (!image) {
      const good = el => {
        const src = (el.getAttribute("src") || "").trim();
        if (!src || src.startsWith("data:") || src === DEFAULT_AVATAR) return false;
        if (el.closest("header, nav, footer")) return false;
        return true;
      };
      const imgs = [...doc.querySelectorAll("img")];
      const preferred =
        imgs.find(el => good(el) && /avatar|profile|pfp|user|icon/i.test(`${el.className} ${el.id} ${el.getAttribute("alt") || ""}`)) ||
        imgs.find(el => good(el) && (el.id === "avatar" || el.classList.contains("avatar") || el.classList.contains("pfp"))) ||
        imgs.find(good);
      if (preferred) image = preferred.getAttribute("src");
    }

    /* ---- badges ---- */
    const badges = extractBadges(doc, jsonBlobs, file);

    return {
      title,
      handle,
      description,
      image: absoluteAsset(image, file),
      badges
    };
  }

  /* ================= discord id discovery ================= */
  function findDiscordId(src) {
    const patterns = [
      /discord(?:app)?\.com\/users\/(\d{15,20})/i,
      /lanyard\.rest\/v1\/users\/(\d{15,20})/i,
      /cdn\.discordapp\.com\/avatars\/(\d{15,20})\//i,
      /dcdn\.dstn\.to\/[a-z]+\/(\d{15,20})/i,
      /discord[\w-]*["'`]?\s*[:=]\s*["'`]?(\d{15,20})/i,
      /(?:user[_-]?id|userid|uid|snowflake)["'`]?\s*[:=]\s*["'`]?(\d{15,20})/i,
      /["'`](\d{17,20})["'`]/,
      /\b(\d{17,20})\b/
    ];
    for (const re of patterns) {
      const m = src.match(re);
      if (m) return m[1];
    }
    return "";
  }

  function findRawAvatar(src, id) {
    const re = new RegExp("cdn\\.discordapp\\.com/avatars/" + id + "/([\\w]+)\\.(png|jpe?g|gif|webp)", "i");
    const m = src.match(re);
    return m ? `https://cdn.discordapp.com/avatars/${id}/${m[1]}.${m[2]}?size=256` : "";
  }

  const defaultDiscordAvatar = id => {
    try { return `https://cdn.discordapp.com/embed/avatars/${Number((BigInt(id) >> 22n) % 6n)}.png`; }
    catch { return DEFAULT_AVATAR; }
  };

  const avatarUrl = (id, hash) =>
    hash ? `https://cdn.discordapp.com/avatars/${id}/${hash}.${hash.startsWith("a_") ? "gif" : "png"}?size=256` : "";

  async function getJson(url, ms = 6000) {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), ms);
    try {
      const res = await fetch(url, { signal: ctl.signal });
      if (!res.ok) return null;
      return await res.json();
    } catch { return null; }
    finally { clearTimeout(t); }
  }

  /* ================= lanyard lookup ================= */
  const discordCache = new Map();
  async function fetchDiscord(id) {
    if (discordCache.has(id)) return discordCache.get(id);
    const job = (async () => {
      for (let attempt = 0; attempt < 2; attempt++) {
        const l = await getJson(`https://api.lanyard.rest/v1/users/${id}`);
        if (l && l.success && l.data && l.data.discord_user) {
          const u = l.data.discord_user;
          const acts = l.data.activities || [];
          const custom = acts.find(a => a.type === 4);
          const other = acts.find(a => a.type !== 4);
          return {
            name: u.global_name || u.display_name || u.username,
            username: u.username,
            avatar: avatarUrl(id, u.avatar),
            presence: l.data.discord_status || "offline",
            status: (custom && (custom.state || custom.name)) || (other ? other.name : "")
          };
        }
      }
      return null;
    })();
    discordCache.set(id, job);
    return job;
  }

  async function getPageInfo(file) {
    const fallback = {
      file, title: safeName(file), handle: SITE, description: "profile",
      image: DEFAULT_AVATAR, badges: [], presence: ""
    };
    const source = await fetchSource(file);
    if (!source) return fallback;

    const parsed = extractProfile(source, file);
    const id = findDiscordId(source);
    const info = {
      file,
      id,
      title: parsed.title || fallback.title,
      handle: parsed.handle || fallback.handle,
      description: parsed.description || fallback.description,
      image: parsed.image || fallback.image,
      badges: parsed.badges || [],
      presence: ""
    };
    if (!id) return info;

    const dc = await fetchDiscord(id);
    const rawAvatar = findRawAvatar(source, id);
    if (dc) {
      info.title = dc.name || info.title;
      info.handle = dc.username ? "@" + dc.username : info.handle;
      info.image = dc.avatar || rawAvatar || defaultDiscordAvatar(id);
      info.presence = dc.presence;
      if (info.description === "profile") info.description = dc.status || "discord · " + id;
    } else {
      info.image = rawAvatar || (info.image === DEFAULT_AVATAR ? defaultDiscordAvatar(id) : info.image);
      if (info.description === "profile") info.description = "discord · " + id;
    }
    return info;
  }

  /* ================= clean urls ================= */
  function pageUrl(file) {
    return new URL("/" + cleanName(file), location.origin).href;
  }
  function syncUrl(file) {
    const target = "/" + cleanName(file);
    try {
      if (location.pathname !== target) history.replaceState(null, "", target);
    } catch {}
  }
  function fileFromPath() {
    let p = "";
    try { p = decodeURIComponent(location.pathname); } catch { p = location.pathname; }
    return p.replace(/^\/+|\/+$/g, "").replace(/\.html?$/i, "").toLowerCase();
  }

  /* ================= rendering ================= */
  function renderBadges(list) {
    const wrap = $("badges");
    wrap.innerHTML = "";
    (list || []).forEach(b => {
      const chip = document.createElement("span");
      chip.className = "badge";
      if (b.img) {
        const img = document.createElement("img");
        img.src = b.img;
        img.alt = b.label || "";
        img.loading = "lazy";
        img.addEventListener("error", () => img.remove());
        chip.append(img);
      }
      if (b.label) chip.append(document.createTextNode(b.label));
      if (chip.childNodes.length) wrap.append(chip);
    });
  }

  function render() {
    if (!pages.length) return;
    const p = pages[selected];
    $("avatar").src = p.image || DEFAULT_AVATAR;
    $("avatar").alt = p.title + " avatar";
    $("title").textContent = p.title;
    $("handle").textContent = p.handle;
    $("description").textContent = p.description;
    renderBadges(p.badges);
    $("count").textContent = String(selected + 1).padStart(2, "0") + " / " + String(pages.length).padStart(2, "0");
    const dot = { online: "#3ba55d", idle: "#faa81a", dnd: "#ed4245" }[p.presence] || "#777";
    document.querySelector(".pulse").style.cssText = `background:${dot};box-shadow:0 0 9px ${dot}`;
    $("rail").querySelectorAll(".thumb").forEach((btn, i) => {
      btn.classList.toggle("active", i === selected);
      btn.setAttribute("aria-current", i === selected ? "true" : "false");
    });
    $("statusText").textContent = p.presence ? p.presence : "profile selected";
    $("view").animate(
      [{ opacity: .65, transform: "translateY(4px)" }, { opacity: 1, transform: "translateY(0)" }],
      { duration: 220, easing: "ease-out" }
    );
  }

  function selectProfile(i, updateUrl) {
    if (!pages.length) return;
    selected = ((i % pages.length) + pages.length) % pages.length;
    render();
    if (updateUrl) syncUrl(pages[selected].file);
  }
  const move = step => selectProfile(selected + step, true);

  function buildRail() {
    const rail = $("rail");
    rail.innerHTML = "";
    pages.forEach((p, i) => {
      const btn = document.createElement("button");
      btn.className = "thumb" + (i === selected ? " active" : "");
      btn.type = "button";
      btn.title = p.title;
      btn.setAttribute("aria-label", "Select " + p.title);
      const img = document.createElement("img");
      img.src = p.image || DEFAULT_AVATAR;
      img.alt = "";
      img.loading = "lazy";
      img.addEventListener("error", () => { if (img.src !== DEFAULT_AVATAR) img.src = DEFAULT_AVATAR; });
      btn.append(img);
      btn.addEventListener("click", () => selectProfile(i, true));
      rail.append(btn);
    });
  }

  /* ================= load ================= */
  async function loadPages() {
    $("repoState").textContent = "checking main";
    $("statusText").textContent = "loading profiles";
    try {
      let names = null;
      try {
        const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents?ref=${BRANCH}`, {
          headers: { Accept: "application/vnd.github+json" }, cache: "no-cache"
        });
        if (res.ok) names = (await res.json()).filter(i => i.type === "file").map(i => i.name);
      } catch {}
      if (!names) {
        const res = await fetch(`https://data.jsdelivr.com/v1/package/gh/${OWNER}/${REPO}@${BRANCH}/flat`, { cache: "no-cache" });
        if (!res.ok) throw new Error("file list unavailable (" + res.status + ")");
        names = (await res.json()).files.map(f => f.name.replace(/^\//, "")).filter(n => !n.includes("/"));
      }
      const htmlFiles = names
        .filter(n => /\.html?$/i.test(n) && n.toLowerCase() !== "index.html")
        .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
      if (!htmlFiles.length) throw new Error("No other HTML files found on main");

      pages = await mapLimit(htmlFiles, 4, getPageInfo);

      const wanted = fileFromPath();
      const matchIdx = wanted
        ? pages.findIndex(pg => cleanName(pg.file).toLowerCase() === wanted)
        : -1;
      selected = matchIdx >= 0 ? matchIdx : 0;
      buildRail();
      render();
      if (matchIdx >= 0) syncUrl(pages[selected].file);

      $("repoState").textContent = pages.length + " pages";
      $("notice").textContent = "";
    } catch (error) {
      pages = [{
        file: "hours.html", title: "Hours", handle: SITE, description: "profile",
        image: DEFAULT_AVATAR, badges: [], presence: ""
      }];
      selected = 0;
      buildRail();
      render();
      $("repoState").textContent = "offline fallback";
      $("statusText").textContent = "profiles unavailable";
      $("notice").textContent = "Couldn't read the repository file list. Check GitHub API access or try again.";
      console.warn(error);
    }
  }

  /* ================= events ================= */
  $("prev").addEventListener("click", () => move(-1));
  $("next").addEventListener("click", () => move(1));
  window.addEventListener("keydown", e => {
    if (e.target.matches("input,textarea,select")) return;
    if (e.key === "ArrowLeft") move(-1);
    if (e.key === "ArrowRight") move(1);
    if (e.key === "Enter" && pages.length) window.location.href = pageUrl(pages[selected].file);
  });
  $("sound").addEventListener("click", async () => {
    soundOn = !soundOn;
    $("sound").textContent = soundOn ? "sound on" : "sound off";
    $("sound").setAttribute("aria-pressed", String(soundOn));
    if (!soundOn) return;
    try {
      audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
      await audioContext.resume();
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.type = "sine";
      osc.frequency.value = 520;
      gain.gain.setValueAtTime(.0001, audioContext.currentTime);
      gain.gain.exponentialRampToValueAtTime(.025, audioContext.currentTime + .025);
      gain.gain.exponentialRampToValueAtTime(.0001, audioContext.currentTime + .18);
      osc.connect(gain); gain.connect(audioContext.destination);
      osc.start(); osc.stop(audioContext.currentTime + .19);
    } catch {
      soundOn = false;
      $("sound").textContent = "sound off";
      $("sound").setAttribute("aria-pressed", "false");
    }
  });
  $("avatar").addEventListener("error", () => { if ($("avatar").src !== DEFAULT_AVATAR) $("avatar").src = DEFAULT_AVATAR; });

  loadPages();
})();
</script>
</body>
</html>
