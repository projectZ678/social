<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DISCORD // PROFILES</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            background: #000;
            color: #e8e8e8;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== ASCII BACKGROUND ===== */
        #ascii-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            line-height: 10px;
            letter-spacing: 0;
            color: #3d3d3d;
            white-space: pre;
            user-select: none;
            filter: blur(1.5px);
            opacity: 0.45;
            transform: scale(1.05);
        }

        #ascii-bg span {
            display: block;
        }

        /* ===== ENTRY SCREEN ===== */
        #entry-screen {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: radial-gradient(
                ellipse 60% 50% at 50% 50%,
                rgba(0, 0, 0, 0.62) 0%,
                rgba(0, 0, 0, 0.28) 45%,
                rgba(0, 0, 0, 0) 80%
            );
            transition:
                opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1),
                visibility 0.7s ease,
                transform 0.7s cubic-bezier(0.22, 1, 0.36, 1),
                filter 0.7s ease;
        }

        #entry-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: scale(1.08);
            filter: blur(8px);
        }

        .enter-text {
            font-size: 0.78rem;
            letter-spacing: 0.55em;
            text-indent: 0.55em;
            text-transform: uppercase;
            color: #bdbdbd;
            text-shadow: 0 0 30px rgba(0, 0, 0, 0.95);
            animation: enterPulse 2.6s ease-in-out infinite;
            transition:
                color 0.45s ease,
                transform 0.45s ease,
                text-shadow 0.45s ease,
                opacity 0.45s ease;
            will-change: opacity, text-shadow, transform;
        }

        @keyframes enterPulse {
            0%, 100% {
                opacity: 0.28;
                text-shadow: 0 0 30px rgba(0, 0, 0, 0.95), 0 0 0 rgba(255, 255, 255, 0);
            }
            50% {
                opacity: 1;
                text-shadow: 0 0 30px rgba(0, 0, 0, 0.95), 0 0 22px rgba(255, 255, 255, 0.35);
            }
        }

        /* hover: freeze the pulse at full brightness with a soft glow */
        #entry-screen:hover .enter-text {
            animation: none;
            opacity: 1;
            color: #fff;
            transform: scale(1.06);
            text-shadow:
                0 0 30px rgba(0, 0, 0, 0.95),
                0 0 34px rgba(255, 255, 255, 0.55);
        }

        /* ===== DASHBOARD ===== */
        #dashboard {
            position: relative;
            z-index: 10;
            width: min(920px, 94vw);
            max-height: 92vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transform: scale(0.9) translateY(14px);
            filter: blur(6px);
            transition:
                opacity 0.85s cubic-bezier(0.22, 1, 0.36, 1) 0.15s,
                transform 0.85s cubic-bezier(0.22, 1, 0.36, 1) 0.15s,
                filter 0.85s ease 0.15s;
            pointer-events: none;
            will-change: opacity, transform, filter;
        }

        #dashboard.visible {
            opacity: 1;
            transform: scale(1) translateY(0);
            filter: blur(0);
            pointer-events: auto;
        }

        /* ===== TOP NAV ===== */
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.8rem;
            padding: 0.8rem 0 1.1rem;
            width: 100%;
        }

        .nav-arrow {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.09);
            color: #9a9a9a;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 1rem;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: all 0.25s ease;
            backdrop-filter: blur(6px);
            flex-shrink: 0;
        }

        .nav-arrow:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.22);
            color: #fff;
        }

        .nav-arrow:active {
            transform: scale(0.94);
        }

        .nav-arrow:disabled {
            opacity: 0.12;
            cursor: not-allowed;
        }

        .profile-dots {
            display: flex;
            gap: 0.55rem;
            align-items: center;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.16);
            transition: all 0.3s ease;
        }

        .dot.active {
            background: #fff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
            transform: scale(1.35);
        }

        /* ===== PROFILE STAGE / CARD ===== */
        .profile-stage {
            position: relative;
            width: 100%;
            min-height: 440px;
        }

        .profile-card {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2.6rem 2rem 2rem;
            background: rgba(10, 10, 10, 0.38);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 24px;
            backdrop-filter: blur(26px) saturate(120%);
            -webkit-backdrop-filter: blur(26px) saturate(120%);
            box-shadow:
                0 30px 90px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            opacity: 0;
            transform: translateX(40px) scale(0.97);
            transition: opacity 0.45s ease, transform 0.45s ease;
            pointer-events: none;
            overflow-y: auto;
        }

        .profile-card.active {
            opacity: 1;
            transform: translateX(0) scale(1);
            pointer-events: auto;
            position: relative;
        }

        .profile-card::-webkit-scrollbar {
            width: 4px;
        }
        .profile-card::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 4px;
        }

        /* ===== AVATAR ===== */
        .avatar-wrap {
            position: relative;
            margin-bottom: 1.4rem;
        }

        .avatar-ring {
            width: 112px;
            height: 112px;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(135deg, rgba(255,255,255,0.22), rgba(255,255,255,0.05));
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            background: #141414;
        }

        .status-dot {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 3px solid rgba(12, 12, 12, 0.9);
            background: #555;
            transition: background 0.3s ease;
        }

        .status-dot.online  { background: #23a55a; }
        .status-dot.idle    { background: #f0b232; }
        .status-dot.dnd     { background: #f23f43; }
        .status-dot.offline { background: #80848e; }

        /* ===== USER INFO ===== */
        .display-name {
            font-size: 1.65rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #fff;
            margin-bottom: 0.2rem;
            text-align: center;
            word-break: break-word;
        }

        .username {
            font-size: 0.8rem;
            color: #7a7a7a;
            letter-spacing: 0.05em;
            margin-bottom: 1.1rem;
        }

        .bio {
            font-size: 0.82rem;
            color: #a5a5a5;
            text-align: center;
            max-width: 480px;
            line-height: 1.55;
            margin-bottom: 1.2rem;
            padding: 0 0.5rem;
        }

        /* ===== BADGES ===== */
        .badges-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.55rem;
            margin-bottom: 1.3rem;
        }

        .badge-icon {
            width: 28px;
            height: 28px;
            object-fit: contain;
            transition: transform 0.2s ease;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.6));
        }

        .badge-icon:hover {
            transform: scale(1.18);
        }

        /* ===== META ===== */
        .meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 0.5rem;
            width: 100%;
            max-width: 540px;
            margin-bottom: 1.4rem;
        }

        .meta-item {
            background: rgba(255, 255, 255, 0.025);
            border-radius: 12px;
            padding: 0.75rem 0.9rem;
            text-align: center;
        }

        .meta-label {
            font-size: 0.58rem;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            color: #5c5c5c;
            margin-bottom: 0.3rem;
        }

        .meta-value {
            font-size: 0.8rem;
            color: #d0d0d0;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ===== AUDIO PLAYER ===== */
        .audio-player {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 0.85rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-top: auto;
        }

        .audio-top {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .play-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.05);
            color: #ddd;
            font-size: 0.9rem;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .play-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        .play-btn:active {
            transform: scale(0.92);
        }

        .track-name {
            flex: 1;
            font-size: 0.72rem;
            color: #777;
            letter-spacing: 0.05em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-name span {
            color: #c8c8c8;
        }

        .progress-wrap {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .time {
            font-size: 0.6rem;
            color: #565656;
            font-variant-numeric: tabular-nums;
            min-width: 32px;
            text-align: center;
        }

        input[type="range"].seek-bar {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 3px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.09);
            outline: none;
            cursor: pointer;
        }

        input[type="range"].seek-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #d0d0d0;
            border: none;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.25);
            transition: transform 0.15s ease;
        }

        input[type="range"].seek-bar::-webkit-slider-thumb:hover {
            transform: scale(1.3);
        }

        input[type="range"].seek-bar::-moz-range-thumb {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #d0d0d0;
            border: none;
            cursor: pointer;
        }

        /* ===== LOADING / ERROR ===== */
        .spinner {
            width: 30px;
            height: 30px;
            border: 2px solid rgba(255, 255, 255, 0.07);
            border-top-color: #aaa;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 2rem auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-msg {
            text-align: center;
            color: #f23f43;
            font-size: 0.8rem;
            padding: 2rem 1rem;
            line-height: 1.6;
        }

        .error-msg small {
            color: #666;
            display: block;
            margin-top: 0.4rem;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 640px) {
            .profile-card {
                padding: 1.7rem 1rem 1.3rem;
                border-radius: 20px;
            }

            .avatar-ring {
                width: 88px;
                height: 88px;
            }

            .status-dot {
                width: 19px;
                height: 19px;
                border-width: 2.5px;
            }

            .display-name {
                font-size: 1.3rem;
            }

            .meta-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .top-nav {
                gap: 1rem;
            }

            .nav-arrow {
                width: 38px;
                height: 38px;
                font-size: 0.9rem;
            }

            #ascii-bg {
                font-size: 7px;
                line-height: 7px;
            }
        }
    </style>
</head>

    <!-- ===== ASCII ART BACKGROUND ===== -->

    <!-- ===== ENTRY SCREEN ===== -->
    <div id="entry-screen" role="button" tabindex="0" aria-label="Click to enter">
        <span class="enter-text">Click to enter</span>
    </div>

    <!-- ===== DASHBOARD ===== -->

        <div class="top-nav">

            <div class="profile-dots" id="dotsContainer"></div>
            <button class="nav-arrow" id="nextBtn" aria-label="Next profile">&#10095;</button>
        </div>

        <div class="profile-stage" id="profileStage">
            <!-- Cards are dynamically injected -->
        </div>
    </div>

@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@`;

        // ============================================================
        //  RENDER ASCII BACKGROUND
        // ============================================================
        (function renderAsciiBackground() {
            const container = document.getElementById('ascii-bg');
            const lines = ASCII_ART.split('\n');
            const fragment = document.createDocumentFragment();
            const repeatCount = Math.max(1, Math.ceil(30 / lines.length));
            for (let r = 0; r < repeatCount; r++) {
                lines.forEach(line => {
                    const span = document.createElement('span');
                    span.textContent = line;
                    fragment.appendChild(span);
                });
            }
            container.appendChild(fragment);
        })();

        // ============================================================
        //  STATE
        // ============================================================
        let currentIndex = 0;
        let audioElements = [];
        let cardElements = [];
        let dotElements = [];
        let isEntered = false;

        const stage = document.getElementById('profileStage');
        const dotsContainer = document.getElementById('dotsContainer');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        // ============================================================
        //  HELPERS
        // ============================================================
        function getAvatarUrl(userId, avatarHash, size = 256) {
            if (!avatarHash) {
                const index = Number(BigInt(userId) % 5n);
                return `https://cdn.discordapp.com/embed/avatars/${index}.png`;
            }
            const ext = avatarHash.startsWith('a_') ? 'gif' : 'png';
            return `https://cdn.discordapp.com/avatars/${userId}/${avatarHash}.${ext}?size=${size}`;
        }

        function formatDate(iso) {
            if (!iso) return 'Unknown';
            try {
                return new Date(iso).toLocaleDateString(undefined, {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric'
                });
            } catch { return 'Unknown'; }
        }

        function formatTime(seconds) {
            if (!isFinite(seconds)) return '0:00';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        // ============================================================
        //  FETCH GRUX DATA
        // ============================================================
        async function fetchProfile(userId) {
            const url = `https://grux.audibert.dev/user/${userId}`;
            const res = await fetch(url);
            if (!res.ok) throw new Error(`Grux API error: ${res.status}`);
            const json = await res.json();
            if (!json.success || !json.data || !json.data.profile) {
                throw new Error('Invalid data returned from Grux');
            }
            return json.data;
        }

        // ============================================================
        //  BUILD CARDS
        // ============================================================
        function buildCards(dataList) {
            stage.innerHTML = '';
            dotsContainer.innerHTML = '';
            cardElements = [];
            dotElements = [];
            audioElements = [];

            dataList.forEach((data, i) => {
                const profile = data.profile;
                const status = data.status || 'offline';

                const card = document.createElement('div');
                card.className = 'profile-card';
                if (i === 0) card.classList.add('active');

                const avatarUrl = profile.avatar_image
                    || getAvatarUrl(profile.id, profile.avatar, 256);

                let badgesHtml = '';
                if (profile.badges && profile.badges.length) {
                    badgesHtml = profile.badges
                        .filter(b => b.badge_image)
                        .map(b => `
                            <img class="badge-icon" src="${b.badge_image}"
                                 alt="${b.description || 'Badge'}"
                                 title="${b.description || ''}"
                                 loading="lazy" />
                        `).join('');
                }

                const created = profile.creation_date
                    ? formatDate(profile.creation_date)
                    : 'Unknown';

                card.innerHTML = `
                    <div class="avatar-wrap">
                        <div class="avatar-ring">
                            <img class="avatar-img" src="${avatarUrl}" alt="${profile.username}" loading="lazy"
                                 onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'" />
                        </div>
                        <span class="status-dot ${status}" title="${status}"></span>
                    </div>

                    <div class="display-name">${profile.display_name || profile.username}</div>
                    <div class="username">@${profile.username}</div>

                    ${profile.bio ? `<div class="bio">${profile.bio}</div>` : ''}

                    ${badgesHtml ? `<div class="badges-row">${badgesHtml}</div>` : ''}

                    <div class="meta-grid">
                        <div class="meta-item">
                            <div class="meta-label">Status</div>
                            <div class="meta-value">${status}</div>
                        </div>
                        <div class="meta-item">
                            <div class="meta-label">Created</div>
                            <div class="meta-value">${created}</div>
                        </div>
                        <div class="meta-item">
                            <div class="meta-label">User ID</div>
                            <div class="meta-value" style="font-size:0.7rem;letter-spacing:0.02em;">${profile.id}</div>
                        </div>
                    </div>

                    <div class="audio-player" data-index="${i}">
                        <div class="audio-top">
                            <button class="play-btn" data-index="${i}" aria-label="Play / pause">&#9654;</button>
                            <div class="track-name"><span>${PROFILES[i].trackTitle || 'Untitled'}</span></div>
                        </div>
                        <div class="progress-wrap">
                            <span class="time current-time">0:00</span>
                            <input type="range" class="seek-bar" min="0" max="100" value="0" step="0.1" data-index="${i}" />
                            <span class="time total-time">0:00</span>
                        </div>
                        <audio preload="metadata" data-index="${i}">
                            <source src="${PROFILES[i].audio}" type="audio/mpeg" />
                        </audio>
                    </div>
                `;

                stage.appendChild(card);
                cardElements.push(card);

                const dot = document.createElement('span');
                dot.className = 'dot' + (i === 0 ? ' active' : '');
                dotsContainer.appendChild(dot);
                dotElements.push(dot);

                // --- Audio wiring ---
                const audio = card.querySelector('audio');
                const playBtn = card.querySelector('.play-btn');
                const seekBar = card.querySelector('.seek-bar');
                const currentTimeEl = card.querySelector('.current-time');
                const totalTimeEl = card.querySelector('.total-time');

                audioElements.push(audio);

                playBtn.addEventListener('click', () => {
                    if (audio.paused) {
                        audioElements.forEach((a, idx) => {
                            if (idx !== i) {
                                a.pause();
                                const otherBtn = cardElements[idx]?.querySelector('.play-btn');
                                if (otherBtn) otherBtn.innerHTML = '&#9654;';
                            }
                        });
                        audio.play().catch(() => {});
                        playBtn.innerHTML = '&#10074;&#10074;';
                    } else {
                        audio.pause();
                        playBtn.innerHTML = '&#9654;';
                    }
                });

                audio.addEventListener('play', () => { playBtn.innerHTML = '&#10074;&#10074;'; });
                audio.addEventListener('pause', () => { playBtn.innerHTML = '&#9654;'; });
                audio.addEventListener('ended', () => { playBtn.innerHTML = '&#9654;'; });

                seekBar.addEventListener('input', () => {
                    if (audio.duration) {
                        audio.currentTime = (seekBar.value / 100) * audio.duration;
                    }
                });

                audio.addEventListener('loadedmetadata', () => {
                    totalTimeEl.textContent = formatTime(audio.duration);
                });

                audio.addEventListener('timeupdate', () => {
                    if (audio.duration) {
                        seekBar.value = (audio.currentTime / audio.duration) * 100;
                        currentTimeEl.textContent = formatTime(audio.currentTime);
                    }
                });
            });

            currentIndex = 0;
            updateActiveCard();
            updateArrowState();
        }

        // ============================================================
        //  NAVIGATION
        // ============================================================
        function updateActiveCard() {
            cardElements.forEach((card, i) => {
                card.classList.toggle('active', i === currentIndex);
            });
            dotElements.forEach((dot, i) => {
                dot.classList.toggle('active', i === currentIndex);
            });
            audioElements.forEach((a, i) => {
                if (i !== currentIndex && !a.paused) {
                    a.pause();
                }
            });
            updateArrowState();
        }

        function updateArrowState() {
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === cardElements.length - 1;
        }

        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                updateActiveCard();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentIndex < cardElements.length - 1) {
                currentIndex++;
                updateActiveCard();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (!isEntered) return;
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prevBtn.click();
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                nextBtn.click();
            }
        });

        // ============================================================
        //  LOADING / ERROR STATES
        // ============================================================
        function showLoading() {
            stage.innerHTML = `
                <div class="profile-card active" style="position:relative;">
                    <div class="spinner"></div>
                    <div style="text-align:center;font-size:0.72rem;color:#666;letter-spacing:0.15em;text-transform:uppercase;">Loading profiles</div>
                </div>
            `;
        }

        function showError(msg) {
            stage.innerHTML = `
                <div class="profile-card active" style="position:relative;">
                    <div class="error-msg">
                        &#9888; ${msg}
                        <small>Make sure the user IDs are correct. The Grux API is public and does not require server membership, but the user must have a public Discord profile.</small>
                    </div>
                </div>
            `;
        }

        // ============================================================
        //  INIT
        // ============================================================
        async function init() {
            showLoading();
            try {
                const results = await Promise.all(PROFILES.map(p => fetchProfile(p.userId)));
                buildCards(results);
            } catch (err) {
                console.error(err);
                showError(err.message || 'Failed to load profiles');
            }
        }

        // ============================================================
        //  ENTRY SCREEN
        // ============================================================
        const entryScreen = document.getElementById('entry-screen');
        const dashboard = document.getElementById('dashboard');

        function enter() {
            if (isEntered) return;
            isEntered = true;
            entryScreen.classList.add('hidden');
            dashboard.classList.add('visible');
        }

        entryScreen.addEventListener('click', enter);
        entryScreen.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                enter();
            }
        });

        // ============================================================
        //  START
        // ============================================================
        init();

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                audioElements.forEach(a => a.pause());
            }
        });
    </script>
