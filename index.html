<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808">
<title>socialanxiety.lol — accounts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Pirata+One&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#080808;--fg:#ededed;--muted:#777;--line:rgba(255,255,255,.09)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif}
body{overflow:hidden}
#ascii{position:fixed;inset:-4%;z-index:0;overflow:hidden;pointer-events:none;user-select:none;white-space:pre;font:clamp(7px,.65vw,11px)/1.2 monospace;letter-spacing:.03em;color:#777;opacity:.17;filter:blur(.6px);transform:scale(1.03);transition:opacity .5s,filter .5s}
body:hover #ascii{opacity:.22;filter:blur(0)}
#shade{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 0%,rgba(0,0,0,.32) 65%,#000 120%)}
.shell{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;padding:clamp(18px,3vw,42px);max-width:1900px;margin:auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:20px;font-size:13px;color:#8c8c8c}
.brand{font-family:Georgia,serif;font-size:clamp(18px,2vw,27px);font-weight:700;letter-spacing:-.04em;color:#e7e7e7;text-decoration:none}
.top-right{display:flex;align-items:center;gap:22px;font:12px/1.2 ui-monospace,monospace}
.sound{border:0;background:none;color:#777;font:inherit;cursor:pointer;transition:color .2s}
.sound:hover{color:#fff}
main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.view{width:min(100%,760px);display:flex;flex-direction:column;align-items:center;text-align:center;animation:enter .45s ease both;transform:scale(.88);transform-origin:center}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.avatar{width:clamp(58px,6vw,82px);height:clamp(58px,6vw,82px);border-radius:50%;object-fit:cover;background:#141414;border:1px solid rgba(255,255,255,.12);box-shadow:0 10px 40px #0008;transition:transform .35s,filter .35s}
.avatar:hover{transform:translateY(-4px) scale(1.04);filter:brightness(1.08)}
.heading{font-family:"Pirata One",Georgia,serif;font-size:clamp(70px,13vw,150px);line-height:.9;letter-spacing:-.02em;font-weight:400;margin:28px 0 18px;color:#eee;text-shadow:0 8px 35px #fff1;max-width:100%;overflow-wrap:anywhere}
.handle{font:12px ui-monospace,SFMono-Regular,monospace;color:#8a8a8a;letter-spacing:.04em;margin:0 0 24px}
.meta{font:11px ui-monospace,monospace;color:#555;letter-spacing:.1em;text-transform:uppercase;margin-bottom:24px}
.actions{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 0 22px}
.arrow{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.025);color:#aaa;font-size:20px;display:grid;place-items:center;cursor:pointer;transition:transform .2s,border-color .2s,color .2s,background .2s}
.arrow:hover{transform:scale(1.08);border-color:rgba(255,255,255,.28);background:#ffffff0a;color:#fff}
.arrow:active{transform:scale(.96)}
.count{font:12px ui-monospace,monospace;color:#666;min-width:74px}
.open{display:inline-flex;align-items:center;gap:10px;padding:11px 17px;border:1px solid rgba(255,255,255,.15);border-radius:999px;background:#ffffff05;color:#ddd;text-decoration:none;font-size:12px;letter-spacing:.02em;transition:background .2s,border-color .2s,transform .2s}
.open:hover{background:#ffffff0d;border-color:#ffffff40;transform:translateY(-2px)}
.rail-wrap{width:min(100%,680px);margin-top:2px}
.rail{display:flex;align-items:center;justify-content:center;gap:clamp(7px,1.2vw,14px);flex-wrap:wrap}
.thumb{--glow:rgba(180,180,255,.75);width:clamp(34px,4.2vw,58px);height:clamp(34px,4.2vw,58px);border-radius:50%;border:1px solid transparent;background:#151515;padding:0;cursor:pointer;overflow:hidden;opacity:.48;filter:grayscale(1);transition:transform .22s,opacity .22s,filter .22s,border-color .22s,box-shadow .22s}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb:hover{opacity:1;transform:translateY(-3px) scale(1.08);filter:grayscale(0);border-color:var(--glow);box-shadow:0 0 9px var(--glow),0 0 24px color-mix(in srgb,var(--glow) 45%,transparent)}
.thumb.active{opacity:1;filter:grayscale(0);border-color:#ddd;transform:scale(1.07);box-shadow:0 0 0 3px #ffffff0c}
.footer{display:flex;justify-content:space-between;align-items:center;gap:15px;color:#555;font:10px ui-monospace,monospace}
.status{display:flex;align-items:center;gap:8px}
.pulse{width:5px;height:5px;border-radius:50%;background:#777;box-shadow:0 0 9px #7777}
#notice{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);font:12px ui-monospace,monospace;color:#888;text-align:center;max-width:90%;z-index:5}
@media(max-width:600px){.shell{padding:18px}.top-right{gap:10px}.heading{margin:22px 0 14px}.actions{margin-bottom:22px}.footer{font-size:9px}.rail{gap:8px}.thumb{width:38px;height:38px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="ascii" aria-hidden="true"></div><div id="shade"></div>
<div class="shell">
  <header class="top">
    <a class="brand" href="./">social</a>
    <div class="top-right">
      <span id="repoState">loading pages</span>
      <button class="sound" id="sound" type="button" aria-pressed="false">sound off</button>
    </div>
  </header>
  <main>
    <section class="view" id="view" aria-live="polite">
      <img class="avatar" id="avatar" alt="" src="https://raw.githubusercontent.com/projectZ678/social/main/79c341f9-ba05-4776-bf23-3e9f1a773768.png">
      <h1 class="heading" id="title">social</h1>
      <p class="handle" id="handle">socialanxiety.lol</p>
      <div class="meta" id="description">account / page</div>
      <div class="actions">
        <button class="arrow" id="prev" type="button" aria-label="Previous account">‹</button>
        <span class="count" id="count">— / —</span>
        <button class="arrow" id="next" type="button" aria-label="Next account">›</button>
      </div>
      <a class="open" id="open" href="hours.html">Open page <span aria-hidden="true">↗</span></a>
      <div class="rail-wrap"><nav class="rail" id="rail" aria-label="Choose a page"></nav></div>
    </section>
  </main>
  <footer class="footer">
    <span>socialanxiety.lol</span>
    <span class="status"><i class="pulse"></i><span id="statusText">connecting to main</span></span>
  </footer>
</div>
<div id="notice" role="status"></div>
<script>
(() => {
  "use strict";

  const OWNER = "projectZ678";
  const REPO = "social";
  const BRANCH = "main";
  const SITE_BASE = "https://socialanxiety.lol/";
  const RAW_BASE = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/`;
  const DEFAULT_AVATAR = RAW_BASE + "79c341f9-ba05-4776-bf23-3e9f1a773768.png";
  const LANYARD = "https://api.lanyard.rest/v1/users/";

  const $ = id => document.getElementById(id);

  let pages = [];
  let selected = 0;
  let soundOn = false;
  let audioContext = null;

  // Background glyph field
  const glyphs = " .:-=+*#%@xX";
  let seed = 93217;
  const rand = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  let art = "";
  for (let y = 0; y < 105; y++) {
    let line = "";
    for (let x = 0; x < 250; x++) {
      const center = Math.abs(x - 125) / 125;
      const density = Math.max(0, 1 - center * .82);
      line += rand() < density * .7 ? glyphs[Math.floor(rand() * glyphs.length)] : " ";
    }
    art += line + "\n";
  }
  $("ascii").textContent = art;

  function safeName(file) {
    return file.replace(/\.html$/i, "").replace(/[-_]+/g, " ").replace(/\b\w/g, c => c.toUpperCase());
  }

  // Extract the first Discord snowflake from a page's PROFILES array (or any long id)
  function extractUserId(source) {
    const profilesMatch = source.match(/PROFILES\s*=\s*\[([\s\S]*?)\]/);
    if (profilesMatch) {
      const idMatch = profilesMatch[1].match(/id\s*:\s*['"`](\d{17,20})['"`]/);
      if (idMatch) return idMatch[1];
    }
    const anyId = source.match(/['"`](\d{17,20})['"`]/);
    return anyId ? anyId[1] : null;
  }

  function avatarFromLanyard(data) {
    const u = data?.discord_user;
    if (!u?.avatar) {
      const idx = Number((BigInt(u?.id || "0") >> 22n) % 6n);
      return `https://cdn.discordapp.com/embed/avatars/${idx}.png`;
    }
    const ext = u.avatar.startsWith("a_") ? "gif" : "png";
    return `https://cdn.discordapp.com/avatars/${u.id}/${u.avatar}.${ext}?size=256`;
  }

  function displayName(data) {
    const u = data?.discord_user;
    return u?.global_name || u?.display_name || u?.username || "unknown";
  }

  function statusLine(data) {
    if (!data) return "offline";
    if (data.listening_to_spotify && data.spotify) {
      return `listening · ${data.spotify.song}`;
    }
    if (data.activities?.length) {
      const act = data.activities.find(a => a.type === 0) || data.activities[0];
      if (act) return `${act.name}${act.details ? " · " + act.details : ""}`;
    }
    return data.discord_status || "offline";
  }

  async function getPageInfo(file) {
    const fallback = {
      file,
      title: safeName(file),
      handle: "@" + safeName(file).toLowerCase(),
      description: "page",
      image: DEFAULT_AVATAR,
      userId: null
    };

    try {
      const res = await fetch(RAW_BASE + encodeURIComponent(file), { cache: "no-cache" });
      if (!res.ok) return fallback;
      const source = await res.text();

      const userId = extractUserId(source);
      if (!userId) return fallback;

      // Live Discord data via Lanyard
      let lanyard = null;
      try {
        const lRes = await fetch(LANYARD + userId, { cache: "no-cache" });
        const lJson = await lRes.json();
        if (lJson.success) lanyard = lJson.data;
      } catch {}

      const title = lanyard ? displayName(lanyard) : safeName(file);
      const handle = lanyard?.discord_user?.username
        ? "@" + lanyard.discord_user.username
        : "@" + safeName(file).toLowerCase();
      const description = lanyard ? statusLine(lanyard) : "page";
      const image = lanyard ? avatarFromLanyard(lanyard) : DEFAULT_AVATAR;

      return { file, title, handle, description, image, userId, lanyard };
    } catch {
      return fallback;
    }
  }

  function pageUrl(file) {
    return new URL(file, SITE_BASE).href;
  }

  function render() {
    if (!pages.length) return;
    const p = pages[selected];

    $("avatar").src = p.image || DEFAULT_AVATAR;
    $("avatar").alt = p.title + " avatar";
    $("title").textContent = p.title;
    $("handle").textContent = p.handle;
    $("description").textContent = p.description;
    $("count").textContent =
      String(selected + 1).padStart(2, "0") + " / " + String(pages.length).padStart(2, "0");

    $("open").href = pageUrl(p.file);
    $("open").setAttribute("aria-label", "Open " + p.title);
    $("open").innerHTML = `Open page <span aria-hidden="true">↗</span>`;

    $("rail").querySelectorAll(".thumb").forEach((btn, i) => {
      btn.classList.toggle("active", i === selected);
      btn.setAttribute("aria-current", i === selected ? "true" : "false");
    });

    $("statusText").textContent = "profile selected";
    $("view").animate(
      [{ opacity: 0.65, transform: "translateY(4px)" }, { opacity: 1, transform: "translateY(0)" }],
      { duration: 220, easing: "ease-out" }
    );
  }

  function move(step) {
    if (!pages.length) return;
    selected = (selected + step + pages.length) % pages.length;
    render();
  }

  function buildRail() {
    const rail = $("rail");
    rail.innerHTML = "";
    const glowColors = [
      "#ff6b6b", "#ffad5c", "#ffe66d", "#8eea75", "#45e6c1",
      "#55c7ff", "#718cff", "#a78bfa", "#e879f9", "#ff78b7",
      "#f472b6", "#b8c0ff"
    ];

    pages.forEach((p, i) => {
      const btn = document.createElement("button");
      btn.className = "thumb" + (i === selected ? " active" : "");
      btn.style.setProperty("--glow", glowColors[i % glowColors.length]);
      btn.type = "button";
      btn.title = p.title;
      btn.setAttribute("aria-label", "Select " + p.title);

      const img = document.createElement("img");
      img.src = p.image || DEFAULT_AVATAR;
      img.alt = "";
      img.loading = "lazy";
      btn.append(img);

      btn.addEventListener("click", () => {
        selected = i;
        render();
      });
      rail.append(btn);
    });
  }

  async function loadPages() {
    $("repoState").textContent = "checking main";
    $("statusText").textContent = "loading profiles";

    try {
      // Fixed fetch (was broken tagged-template syntax before)
      const response = await fetch(
        `https://api.github.com/repos/${OWNER}/${REPO}/contents?ref=${BRANCH}`,
        {
          headers: { Accept: "application/vnd.github+json" },
          cache: "no-cache"
        }
      );
      if (!response.ok) throw new Error("GitHub API " + response.status);

      const entries = await response.json();
      const htmlFiles = entries
        .filter(
          item =>
            item.type === "file" &&
            /\.html?$/i.test(item.name) &&
            item.name.toLowerCase() !== "index.html"
        )
        .map(item => item.name)
        .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));

      if (!htmlFiles.length) throw new Error("No other HTML files found");

      pages = await Promise.all(htmlFiles.map(getPageInfo));
      buildRail();
      selected = 0;
      render();

      $("repoState").textContent = pages.length + " pages";
      $("statusText").textContent = "profiles ready";
      $("notice").textContent = "";
    } catch (error) {
      pages = [
        {
          file: "hours.html",
          title: "Hours",
          handle: "@hours",
          description: "profile",
          image: DEFAULT_AVATAR,
          userId: null
        }
      ];
      buildRail();
      render();
      $("repoState").textContent = "offline fallback";
      $("statusText").textContent = "profiles unavailable";
      $("notice").textContent =
        "Couldn't read the repository file list. Check GitHub API access or try again.";
      console.warn(error);
    }
  }

  $("prev").addEventListener("click", () => move(-1));
  $("next").addEventListener("click", () => move(1));

  window.addEventListener("keydown", e => {
    if (e.target.matches("input,textarea,select")) return;
    if (e.key === "ArrowLeft") move(-1);
    if (e.key === "ArrowRight") move(1);
    if (e.key === "Enter" && pages.length) {
      window.location.href = pageUrl(pages[selected].file);
    }
  });

  $("sound").addEventListener("click", async () => {
    soundOn = !soundOn;
    $("sound").textContent = soundOn ? "sound on" : "sound off";
    $("sound").setAttribute("aria-pressed", String(soundOn));
    if (soundOn) {
      try {
        audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
        await audioContext.resume();
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.type = "sine";
        osc.frequency.value = 520;
        gain.gain.setValueAtTime(0.0001, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.025, audioContext.currentTime + 0.025);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 0.18);
        osc.connect(gain);
        gain.connect(audioContext.destination);
        osc.start();
        osc.stop(audioContext.currentTime + 0.19);
      } catch {
        soundOn = false;
        $("sound").textContent = "sound off";
      }
    }
  });

  loadPages();
})();
</script>
</body>
</html>
